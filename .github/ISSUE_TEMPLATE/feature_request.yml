name: Feature request
description: Describe a workflow problem and the result you need.
body:
  - type: markdown
    attributes:
      value: |
        For an open-ended idea, [start a discussion](https://github.com/logelog/shipit-seo-plugin/discussions).
        Keep private site data and credentials out of examples.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the workflow and where the current behavior gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the result you would like. A mockup or synthetic example can help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and constraints
      description: Mention alternatives you tried and any effect on permissions, saved data, external services, cost or large sites.
